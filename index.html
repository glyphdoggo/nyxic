<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nyxic Transcriber</title>
		<style>
			:root {
				--bg-body: #eee;
				--bg-container: #ddd;
				--bg-canvas: #eee;
				--text-main: #222;
				--text-muted: #555;
				--border: #bbb;
				--slider-thumb: #222;
			}
			[data-theme="dark"] {
				--bg-body: #1e1e1e;
				--bg-container: #2d2d2d;
				--bg-canvas: #1e1e1e;
				--text-main: #ddd;
				--text-muted: #aaa;
				--border: #444;
				--slider-thumb: #ddd;
			}
			body {
				font-family: sans-serif;
				font-size: 20px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				background-color: var(--bg-body);
				color: var(--text-main);
				transition: background-color .3s ease;
				padding: 20px;
				box-sizing: border-box;
			}
			h2 {
				margin-top: 0;
				margin-bottom: 0;
				text-align: center;
			}
			.container {
				background: var(--bg-container);
				padding: 20px;
				border-radius: 20px;
				box-shadow: 0 5px 15px rgba(0, 0, 0, .25);
				width: 100%;
				max-width: 1000px;
				display: flex;
				flex-direction: column;
				gap: 20px;
				box-sizing: border-box;
				transition: background-color .3s ease, color .3s ease;
			}
			.controls-toolbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 20px;
				width: 100%;
			}
			.input-wrapper {
				flex: 1 1 200px;
			}
			textarea {
				width: 100%;
				padding: 10px;
				font-family: sans-serif;
				font-size: 16px;
				border: 2px solid var(--border);
				background-color: var(--bg-canvas);
				color: var(--text-main);
				border-radius: 10px;
				text-align: center;
				box-sizing: border-box;
				transition: all .3s ease;
				resize: vertical;
			}
			.settings-wrapper {
				display: flex;
				align-items: center;
				gap: 20px;
				flex: 1 1 280px;
			}
			.sliders-group {
				display: flex;
				flex-direction: column;
				gap: 20px;
				flex: 1;
			}
			.slider-wrapper {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.slider-wrapper label {
				font-size: 12px;
				font-weight: bold;
				color: var(--text-muted);
				text-transform: uppercase;
				letter-spacing: .5px;
			}
			input[type="range"] {
				width: 100%;
				margin: 0;
				cursor: pointer;
			}
			.buttons-group {
				display: grid;
				grid-template-columns: repeat(1, 42px);
				grid-template-rows: repeat(2, 42px);
				gap: 10px;
				flex-shrink: 0;
			}
			.icon-btn {
				background: none;
				border: 2px solid var(--border);
				color: var(--text-muted);
				width: 42px;
				height: 42px;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0;
				transition: all .3s ease;
			}
			.icon-btn:hover {
				background: var(--bg-body);
				color: var(--text-main);
				border-color: var(--text-main);
			}
			.icon-btn svg {
				width: 20px;
				height: 20px;
			}
			.canvas-frame {
				width: 100%;
				height: 320px;
				background: var(--bg-canvas);
				border-radius: 10px;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				transition: background-color .3s ease;
			}
			svg {
				width: 100%;
				height: 100%;
				display: block;
			}
			#glyph-group path:not(.weave-mask) {
				stroke: var(--text-main) !important;
				transition: stroke .3s ease;
			}
			#glyph-group path.weave-mask {
				stroke: var(--bg-canvas) !important;
				transition: stroke .3s ease;
			}
			.sun-icon { display: block; }
			.moon-icon { display: none; }
			[data-theme="dark"] .sun-icon { display: none; }
			[data-theme="dark"] .moon-icon { display: block; }
			.diamond-icon { display: block; }
			.circle-icon { display: none; }
			#style-toggle.rounded .diamond-icon { display: none; }
			#style-toggle.rounded .circle-icon { display: block; }
			/*.weave-on-icon { display: block; }
			.weave-off-icon { display: none; }
			#weave-toggle.woven .weave-on-icon { display: none; }
			#weave-toggle.woven .weave-off-icon { display: block; }*/
			@media (max-width: 600px) {
				.controls-toolbar {
					flex-direction: column;
				}
				.input-wrapper {
					width: 100%;
					flex: none;
				}
				.settings-wrapper {
					width: 100%;
					flex: none;
				}
				.sliders-group {
					width: 100%;
				}
				.buttons-group {
					justify-content: center;
					margin: 0 auto;
				}
			}
		</style>
	</head>

		<script>
			// ==========================================
			// 1. GLOBAL LEXICON & ALPHABET CONFIGURATION
			// ==========================================
			const CONSONANTS = new Set([
				"m", "n", "v", "th", "gh", "l", "r", "w", "p", "t", "f", "s", "sh", "ch", "k", "b", "d", "z", "zh", "h", "j", "g", "tion", "sion", "dg", "dj", "wr", "kn", "gn"
			]);
			const VOWELS = new Set([
				"a", "e", "i", "o", "u", "y",
				"aa", "au", "aw", "oo", "ou", "ow", "eu", "ew", "ie", "ei", "ey", "ai", "ay", "ea", "ee", "oi", "oy", "ue", "uu", "uw", "oa", "oe",
				"ar", "er", "ir", "or", "ur",
				"aar", "air", "ear", "eer", "ier", "oar", "oor",
			]);
			const PHONEME_KEYS = [
				",", ".", ";", ":", "!", "?", "-",
				"stion",
				"tion", "sion",
				"aar", "air", "ear", "eer", "ier", "oar", "oor",
				"dg", "dj", "wr", "kn", "gn", "th", "sh", "ch", "ph", "wh", "qu", "ng", "zh", "gh",
				"aa", "aw", "uu", "ue", "oo", "uw", "ow", "ey", "ay", "ai", "ea", "ee", "oy", "oa", "au", "ou", "ei", "oi", "oe", "eu", "ew", "ie",
				"ar", "er", "ir", "or", "ur",
				"m", "n", "v", "l", "r", "p", "t", "f", "s", "x", "k", "c", "q", "b", "d", "z", "h", "j", "g", "y", "w",
				"a", "e", "i", "o", "u",
			];
			const ALPHABET = {
				m:	 ["b", "b", "b"],
				w:	 ["b", "b", "s"],
				r:	 ["b", "b", "x"],
				n:	 ["b", "s", "b"],
				l:	 ["b", "s", "s"],
				s:	 ["b", "s", "x"],
				v:	 ["b", "x", "b"],
				y:	 ["b", "x", "s"],// PRICE
				p:	 ["s", "b", "b"],
				k:	 ["s", "b", "s"],
				ch:	 ["s", "b", "x"],
				t:	 ["s", "s", "b"],
				0:	 ["s", "s", "s"],
				sh:	 ["s", "s", "x"],
				f:	 ["s", "x", "b"],
				th:	 ["s", "x", "s"],
				b:	 ["x", "b", "b"],
				g:	 ["x", "b", "s"],
				j:	 ["x", "b", "x"],
				d:	 ["x", "s", "b"],
				h:	 ["x", "s", "s"],
				z:	 ["x", "s", "x"],
				a:	 ["b", "b", "b"],// TRAP
				ai:	 ["b", "b", "s"],// FACE
				air: ["b", "b", "x"],// SQUARE
				e:	 ["b", "s", "b"],// DRESS
				ee:	 ["b", "s", "s"],// FLEECE
				eer: ["b", "s", "x"],// NEAR
				i:	 ["b", "x", "b"],// KIT
				u:	 ["s", "b", "b"],// STRUT
				ou:	 ["s", "b", "s"],// MOUTH
				ur:	 ["s", "b", "x"],// NURSE
				aa:	 ["s", "s", "b"],// PALM
				ar:	 ["s", "s", "x"],// START
				au:	 ["s", "x", "b"],// THOUGHT
				oi:	 ["s", "x", "s"],// CHOICE
				o:	 ["x", "b", "b"],// LOT
				oa:	 ["x", "b", "s"],// GOAT
				or:	 ["x", "b", "x"],// NORTH
				oo:	 ["x", "s", "b"],// FOOT
				eu:	 ["x", "s", "s"],// GOOSE
				oor: ["x", "s", "x"],// CURE
			};
			// ==========================================
			// 2. DOM ELEMENTS & APP STATE
			// ==========================================
			const inputElement = document.getElementById("transcriber-input");
			const thicknessSlider = document.getElementById("thickness");
			const overshootSlider = document.getElementById("overshoot");
			const spacingSlider = document.getElementById("spacing");
			const glyphGroup = document.getElementById("glyph-group");
			const svgCanvas = document.getElementById("script-canvas");
			const styleToggle = document.getElementById("style-toggle");
			const themeToggle = document.getElementById("theme-toggle");
			const exportButton = document.getElementById("export-button");
			// const weaveToggle = document.getElementById("weave-toggle");
			// const infoToggle = document.getElementById("info-view");
			const baseCanvasHeight = 0;
			const padding = 200;
			const halfWidth = 100;
			const blockWidth = 200;
			const blockHeight = 300;
			const blockSpacingVertical = 150;
			const wordSpacing = 150;
			const maxBlocksCeiling = 40;
			let currentThickness = thicknessSlider.value;
			let currentOvershoot = parseInt(overshootSlider.value, 10);
			let currentSpacing = parseFloat(spacingSlider.value);
			let currentStyle = "rounded";
			let weaveMode = false;
			let renderingQueue = [];
			// ==========================================
			// 3. CORE LOGIC ENGINE
			// ==========================================
			function isBoundary(char) {
				return char && !CONSONANTS.has(char) && !VOWELS.has(char);
			}
			function tokenizeText(text) {
				let rawTokens = [];
				let i = 0;
				const cleanText = text.toLowerCase();
				while (i < cleanText.length) {
					if (cleanText[i] === "\n") {
						rawTokens.push("\n");
						i++;
						continue;
					}
					if (cleanText[i] === " ") {
						rawTokens.push(" ");
						i++;
						continue;
					}
					if (cleanText[i] === "-" || cleanText[i] === "'") {
						rawTokens.push(cleanText[i]);
						i++;
						continue;
					}
					let matchFound = false;
					for (const key of PHONEME_KEYS) {
						if (cleanText.substring(i, i + key.length) === key) {
							if (key === "x") {
								rawTokens.push("k", "s");
							} else if (key === "c") {
								const nextChar = cleanText[i + 1];
								const charAfterNext = cleanText[i + 2];
								const isTerminalE = (nextChar === "e" && (i + 2 >= cleanText.length || isBoundary(charAfterNext)));
								if (nextChar === "i" || (nextChar === "e" && !isTerminalE)) {
									rawTokens.push("s");
								} else if (isTerminalE) {
									rawTokens.push("s");
									i ++;
								} else {
									rawTokens.push("k");
								}
							} else if (key === "g") {
								const nextChar = cleanText[i + 1];
								const charAfterNext = cleanText[i + 2];
								const isTerminalE = (nextChar === "e" && (i + 2 >= cleanText.length || isBoundary(charAfterNext)));
								if (nextChar === "e" && !isTerminalE) {
									rawTokens.push("j");
								} else if (isTerminalE) {
									rawTokens.push("j");
									i ++;
								} else {
									rawTokens.push("g");
								}
							} else if (key === "q") {
								rawTokens.push("k");
							} else if (key === "qu") {
								rawTokens.push("k", "w");
							} else if (key === "ng") {
								rawTokens.push("h");
							} else if (key === "stion") {
								rawTokens.push("s", "ch", "u", "n");
							} else if (key === "tion") {
								rawTokens.push("sh", "u", "n");
							} else if (key === "sion") {
								rawTokens.push("z", "u", "n");
							} else if (key === "dg" || key === "dj") {
								rawTokens.push("j");
							} else if (key === "wr") {
								rawTokens.push("r");
							} else if (key === "kn") {
								rawTokens.push("n");
							} else if (key === "gn") {
								rawTokens.push("n");
							} else if (key === "ph") {
								rawTokens.push("f");
							} else if (key === "gh") {
								rawTokens.push("");
							} else if (key === "wh") {
								rawTokens.push("w");
							} else if (key === "zh") {
								rawTokens.push("z");
							} else if (key === "aw") {
								rawTokens.push("au");
							} else if (key === "ay" || key === "ei" || key === "ey") {
								rawTokens.push("ai");
							} else if (key === "ea" || key === "ie") {
								rawTokens.push("ee");
							} else if (key === "oe") {
								rawTokens.push("oa");
							} else if (key === "oy") {
								rawTokens.push("oi");
							} else if (key === "ow") {
								rawTokens.push("ou");
							} else if (key === "uu" || key === "uw"|| key === "ew"|| key === "ue") {
								rawTokens.push("eu");
							} else if (key === "aar") {
								rawTokens.push("ar");
							} else if (key === "ear" || key === "ier") {
								rawTokens.push("eer");
							} else if (key === "er" || key === "ir" || key === "yr") {
								rawTokens.push("ur");
							} else if (key === "oar") {
								rawTokens.push("or");
							} else {
								rawTokens.push(key);
							}
							i += key.length;
							matchFound = true;
							break;
						}
					}
					if (!matchFound) i++;
				}
				const filteredTokens = [];
				for (let j = 0; j < rawTokens.length; j++) {
					const current = rawTokens[j];
					const previous = filteredTokens[filteredTokens.length - 1];
					if (CONSONANTS.has(current) && current === previous) continue;
					filteredTokens.push(current);
				}
				return filteredTokens;
			}
			function generateSyllabicBlocks(tokens) {
				const blocks = [];
				let currentBlock = null;
				for (let i = 0; i < tokens.length; i++) {
					const token = tokens[i];
					if (token === "\n") {
						if (currentBlock) {
							currentBlock.right = "0";
							blocks.push(currentBlock);
							currentBlock = null;
						}
						blocks.push({ type: "newline" });
					}
					else if (token === " ") {
						if (currentBlock) {
							currentBlock.right = "0";
							blocks.push(currentBlock);
							currentBlock = null;
						}
						blocks.push({ type: "space" });
					}
					else if ([",", ".", ";", ":", "!", "?", "-"].includes(token)) {
						if (currentBlock) {
							currentBlock.right = "0";
							blocks.push(currentBlock);
							currentBlock = null;
						}
						blocks.push({ type: "punctuation", value: token });
					}
					else if (token === "-" || token === "'") {
						if (currentBlock) {
							currentBlock.right = "0";
							blocks.push(currentBlock);
							currentBlock = null;
						}
					}
					else if (token === "y") {
						const nextToken = tokens[i + 1];
						const isConsonantY = nextToken && VOWELS.has(nextToken);
						if (isConsonantY) {
							if (currentBlock) {
								currentBlock.right = "0";
								blocks.push(currentBlock);
							}
							currentBlock = { type: "glyph", left: token, right: null };
						} else {
							if (currentBlock) {
								currentBlock.right = token;
								blocks.push(currentBlock);
								currentBlock = null;
							} else {
								blocks.push({ type: "glyph", left: "0", right: token });
							}
						}
					}
					else if (CONSONANTS.has(token)) {
						if (currentBlock) {
							currentBlock.right = "0";
							blocks.push(currentBlock);
						}
						currentBlock = { type: "glyph", left: token, right: null };
					} else if (VOWELS.has(token)) {
						if (currentBlock) {
							currentBlock.right = token;
							blocks.push(currentBlock);
							currentBlock = null;
						} else {
							blocks.push({ type: "glyph", left: "0", right: token });
						}
					}
				}
				if (currentBlock) {
					currentBlock.right = "0";
					blocks.push(currentBlock);
				}
				return blocks;
			}
			function createPathElement(dAttribute, style) {
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("d", dAttribute);
				path.setAttribute("stroke", "#000");
				path.setAttribute("stroke-width", activeStrokeWidth);
				path.setAttribute("stroke-linecap", style === "angular" ? "square" : "round");
				path.setAttribute("fill", "none");
				return path;
			}
			function createMaskPathElement(dAttribute, style, width) {
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("d", dAttribute);
				path.setAttribute("class", "weave-mask");
				path.setAttribute("stroke-width", width);
				path.setAttribute("stroke-linecap", style === "angular" ? "square" : "round");
				path.setAttribute("fill", "none");
				return path;
			}
			function drawPunctuation(value, xOffset, yOffset, style) {
				const cx = xOffset + 50;
				let yPositions = [];
				if (value === "," || value === "." || value === "-") {
					yPositions = [150];
				} else if (value === ";" || value === ":") {
					yPositions = [95, 205];
				} else if (value === "!" || value === "?") {
					yPositions = [40, 150, 260];
				}
				const r = Math.max(1, activeStrokeWidth * .5);
				for (const cy of yPositions) {
					const absoluteY = yOffset + cy;
					let d = "";
					if (style === "angular") {
						d = `M ${cx} ${absoluteY - r} L ${cx + r} ${absoluteY} L ${cx} ${absoluteY + r} L ${cx - r} ${absoluteY} Z`;
					} else {
						d = `M ${cx - r} ${absoluteY} a ${r} ${r} 0 1 0 ${r * 2} 0 a ${r} ${r} 0 1 0 -${r * 2} 0`;
					}
					const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
					path.setAttribute("d", d);
					path.setAttribute("fill", "var(--text-main)");
					path.setAttribute("stroke", "none");
					glyphGroup.appendChild(path);
				}
			}
			function drawActualArc(type, level, x, yOffset, row, isLeftColumn, style, partnerLevel = null, shouldMask = false) {
				const cellY = yOffset + row * 100;
				let d;
				const maskWidth = Math.max(parseFloat(activeStrokeWidth) + 2, 50 - .1 / parseFloat(activeStrokeWidth));
				if (style === "angular") {
					if (type === "b") d = `M ${x} ${cellY} L ${x + 100} ${cellY + 100}`;
					if (type === "s") d = `M ${x + 100} ${cellY} L ${x} ${cellY + 100}`;
					
					renderingQueue.push({
						d: d,
						style: style,
						isMask: shouldMask,
						maskWidth: maskWidth
					});
					return;
				}
				let cx, cy, startAngle, endAngle, sweepFlag;
				const r = level * 100;
				if (level === 1) {
					if (type === "b") {
						if (isLeftColumn) {
							cx = x + 100; cy = cellY; startAngle = Math.PI / 2; endAngle = Math.PI; sweepFlag = 1;
						} else {
							cx = x; cy = cellY + 100; startAngle = 3 * Math.PI / 2; endAngle = 2 * Math.PI; sweepFlag = 1;
						}
					} else {
						if (isLeftColumn) {
							cx = x + 100; cy = cellY + 100; startAngle = 3 * Math.PI / 2; endAngle = Math.PI; sweepFlag = 0;
						} else {
							cx = x; cy = cellY; startAngle = Math.PI / 2; endAngle = 0; sweepFlag = 0;
						}
					}
				} else {
					if (type === "b") {
						if (isLeftColumn) {
							cx = x + 100;
							cy = yOffset + (row + 1) * 100 - r;
							startAngle = Math.PI / 2;
							sweepFlag = 1;
							endAngle = level === 2 ? (120 * Math.PI) / 180 : (110 * Math.PI) / 180;
						} else {
							cx = x;
							cy = yOffset + row * 100 + r;
							startAngle = 3 * Math.PI / 2;
							sweepFlag = 1;
							endAngle = level === 2 ? (300 * Math.PI) / 180 : (290 * Math.PI) / 180;
						}
					} else {
						if (isLeftColumn) {
							cx = x + 100;
							cy = yOffset + row * 100 + r;
							startAngle = 3 * Math.PI / 2;
							sweepFlag = 0;
							endAngle = level === 2 ? (240 * Math.PI) / 180 : (250 * Math.PI) / 180;
						} else {
							cx = x;
							cy = yOffset + (row + 1) * 100 - r;
							startAngle = Math.PI / 2;
							sweepFlag = 0;
							endAngle = level === 2 ? (60 * Math.PI) / 180 : (70 * Math.PI) / 180;
						}
					}
				}
				if (partnerLevel !== null) {
					const partnerType = (type === "b") ? "s" : "b";
					const partnerR = partnerLevel * 100;
					let partnerCy;
					if (partnerLevel === 1) {
						partnerCy = (partnerType === "b") ? (isLeftColumn ? cellY : cellY + 100) : (isLeftColumn ? cellY + 100 : cellY);
					} else {
						partnerCy = (partnerType === "b") ? (isLeftColumn ? (yOffset + (row + 1) * 100 - partnerR) : (yOffset + row * 100 + partnerR)) : (isLeftColumn ? (yOffset + row * 100 + partnerR) : (yOffset + (row + 1) * 100 - partnerR));
					}
					if (cy !== partnerCy) {
						const Y = (partnerR * partnerR - r * r + cy * cy - partnerCy * partnerCy) / (2 * (cy - partnerCy));
						const dX2 = r * r - (Y - cy) * (Y - cy);
						if (dX2 >= 0) {
							const dX = (isLeftColumn ? -1 : 1) * Math.sqrt(dX2);
							const intersectionAngle = Math.atan2(Y - cy, dX);
							if (partnerLevel <= level) {
								if (level > 1) {
									let targetEndAngle = endAngle;
									if (row === 1) {
										const baseOvershootAngle = (2 * Math.PI) - Math.asin(0.75) - ((300 * Math.PI) / 180);
										targetEndAngle += (sweepFlag === 1 ? baseOvershootAngle : -baseOvershootAngle);
										if (partnerLevel === level) {
											const linearOvershoot = currentOvershoot * (((2 * Math.PI) - Math.asin(.75) - ((300 * Math.PI) / 180)) * r) / 10;
											const angleOvershoot = linearOvershoot / r;
											endAngle += (sweepFlag === 1 ? angleOvershoot : -angleOvershoot);
										} else {
											const sweepDir = sweepFlag === 1 ? 1 : -1;
											let angleDiff = (targetEndAngle - intersectionAngle) * sweepDir;
											while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
											while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
											if (angleDiff < 0) angleDiff = 0;
											const scaledOvershoot = angleDiff * (currentOvershoot / 10);
											endAngle = intersectionAngle + sweepDir * scaledOvershoot;
										}
									} else {
										const linearOvershoot = currentOvershoot * 3.6;
										const angleOvershoot = linearOvershoot / r;
										endAngle = intersectionAngle + (sweepFlag === 1 ? angleOvershoot : -angleOvershoot);
									}
								}
							}
						}
					}
				}
				else if (level > 1 && row === 1) {
					const linearOvershoot = currentOvershoot * (((2 * Math.PI) - Math.asin(.75) - ((300 * Math.PI) / 180)) * r) / 10;
					const angleOvershoot = linearOvershoot / r;
					endAngle += (sweepFlag === 1 ? angleOvershoot : -angleOvershoot);
				}
				const sx = cx + r * Math.cos(startAngle);
				const sy = cy + r * Math.sin(startAngle);
				const ex = cx + r * Math.cos(endAngle);
				const ey = cy + r * Math.sin(endAngle);
				d = `M ${sx} ${sy} A ${r} ${r} 0 0 ${sweepFlag} ${ex} ${ey}`;
				renderingQueue.push({
					d: d,
					style: style,
					isMask: shouldMask,
					maskWidth: maskWidth
				});
			}
			function drawTripleStack(phoneme, xOffset, yOffset, isLeftColumn, style) {
				const rules = ALPHABET[phoneme] || ALPHABET["0"];
				function getLevelB(row) {
					if (isLeftColumn) {
						if (row === 0) return 1;
						const prevHasOpposite = rules[row - 1] === "s" || rules[row - 1] === "x";
						if (prevHasOpposite) return 1;
						return getLevelB(row - 1) + 1;
					} else {
						if (row === 2) return 1;
						const prevHasOpposite = rules[row + 1] === "s" || rules[row + 1] === "x";
						if (prevHasOpposite) return 1;
						return getLevelB(row + 1) + 1;
					}
				}
				function getLevelS(row) {
					if (isLeftColumn) {
						if (row === 2) return 1;
						const prevHasOpposite = rules[row + 1] === "b" || rules[row + 1] === "x";
						if (prevHasOpposite) return 1;
						return getLevelS(row + 1) + 1;
					} else {
						if (row === 0) return 1;
						const prevHasOpposite = rules[row - 1] === "b" || rules[row - 1] === "x";
						if (prevHasOpposite) return 1;
						return getLevelS(row - 1) + 1;
					}
				}
				for (let row = 0; row < 3; row++) {
					const cellType = rules[row];
					if (cellType === "none") continue;
					if (cellType === "x") {
						const levelB = getLevelB(row);
						const levelS = getLevelS(row);
						const bIsOver = (row % 2 === 1);
						if (bIsOver) {
							drawActualArc("s", levelS, xOffset, yOffset, row, isLeftColumn, style, levelB, false);
							drawActualArc("b", levelB, xOffset, yOffset, row, isLeftColumn, style, levelS, true);
						} else {
							drawActualArc("b", levelB, xOffset, yOffset, row, isLeftColumn, style, levelS, false);
							drawActualArc("s", levelS, xOffset, yOffset, row, isLeftColumn, style, levelB, true);
						}
					} else if (cellType === "b") {
						const level = getLevelB(row);
						drawActualArc("b", level, xOffset, yOffset, row, isLeftColumn, style, null, false);
					} else if (cellType === "s") {
						const level = getLevelS(row);
						drawActualArc("s", level, xOffset, yOffset, row, isLeftColumn, style, null, false);
					}
				}
			}
			function renderGlyph() {
				// if (document.getElementById("info-view").style.display === "block") return;
				const text = inputElement.value;
				glyphGroup.innerHTML = "";
				renderingQueue = [];
				function updateCanvasViewBox(w, h) {
					const bleed = activeStrokeWidth / 2;
					svgCanvas.setAttribute(
						"viewBox",
						`-${padding + bleed} -${padding + bleed} ${w + (padding * 2) + activeStrokeWidth} ${h + (padding * 2) + activeStrokeWidth}`
					);
				}
				const structuralLimit = currentStyle === "angular" ? 50 * Math.sqrt(2) : 100.0;
				activeStrokeWidth = 1 + ((structuralLimit - 2) / 20) * (currentThickness - 1);
				const targetTheta = (2 * Math.PI) - Math.asin(0.75);
				const singleProtrusion = (200 * Math.cos(targetTheta)) - 100;
				const exactTargetGap = 2 * singleProtrusion;
				const perfectRoundedFactor = (exactTargetGap / 0.5) - activeStrokeWidth;				
				const baseSpacingFactor = currentStyle === "angular" ? perfectRoundedFactor * Math.sqrt(2) / 2 : perfectRoundedFactor;
				const blockSpacingHorizontal = baseSpacingFactor * currentSpacing + activeStrokeWidth * currentSpacing;
				const tokens = tokenizeText(text);
				const blocks = generateSyllabicBlocks(tokens);
				while (blocks.length > 0 && blocks[blocks.length - 1].type === "space") {
					blocks.pop();
				}
				if (blocks.length === 0) {
					updateCanvasViewBox(blockWidth, baseCanvasHeight);
					return;
				}
				let cursorX = 0;
				let cursorY = 0;
				const maxLineAllowedWidth = maxBlocksCeiling * blockWidth + (maxBlocksCeiling - 1) * blockSpacingHorizontal;
				const lineWrapBoundary = maxLineAllowedWidth - blockWidth;
				let maxReachedX = 0;
				let maxReachedY = baseCanvasHeight;
				for (let i = 0; i < blocks.length; i++) {
					const block = blocks[i];
					if (block.type === "newline") {
						cursorX = 0;
						cursorY += blockHeight + blockSpacingVertical + activeStrokeWidth;
						continue;
					}
					let currentStepWidth = blockWidth;
					if (block.type === "space") {
						currentStepWidth = wordSpacing;
					} else if (block.type === "punctuation") {
						currentStepWidth = 100;
					}
					if (cursorX > lineWrapBoundary + 1 && i > 0) {
						cursorX = 0;
						cursorY += blockHeight + blockSpacingVertical + activeStrokeWidth;
					}
					if (block.type === "space") {
						if (cursorX + currentStepWidth > maxReachedX) maxReachedX = cursorX + currentStepWidth;
						if (cursorY + blockHeight > maxReachedY) maxReachedY = cursorY + blockHeight;
						cursorX += wordSpacing - 36;
					}
					else if (block.type === "punctuation") {
						drawPunctuation(block.value, cursorX, cursorY, currentStyle);
						if (cursorX + currentStepWidth > maxReachedX) maxReachedX = cursorX + currentStepWidth;
						if (cursorY + blockHeight > maxReachedY) maxReachedY = cursorY + blockHeight;
						cursorX += currentStepWidth + blockSpacingHorizontal;
					}
					else {
						drawTripleStack(block.left, cursorX, cursorY, true, currentStyle);
						drawTripleStack(block.right, cursorX + halfWidth, cursorY, false, currentStyle);
						if (cursorX + blockWidth > maxReachedX) maxReachedX = cursorX + blockWidth;
						if (cursorY + blockHeight > maxReachedY) maxReachedY = cursorY + blockHeight;
						cursorX += blockWidth + blockSpacingHorizontal;
					}
				}
				for (const pathData of renderingQueue) {
					if (!pathData.isMask) {
						glyphGroup.appendChild(createPathElement(pathData.d, pathData.style));
					}
				}
				for (const pathData of renderingQueue) {
					if (pathData.isMask) {
						if (weaveMode) {
							glyphGroup.appendChild(createMaskPathElement(pathData.d, pathData.style, pathData.maskWidth));
						}
						glyphGroup.appendChild(createPathElement(pathData.d, pathData.style));
					}
				}
				updateCanvasViewBox(maxReachedX, maxReachedY);
			}
			// ==========================================
			// 4. EVENT LISTENERS & INITIALIZATION
			// ==========================================
			inputElement.addEventListener("input", renderGlyph);
			thicknessSlider.addEventListener("input", (e) => { currentThickness = e.target.value; renderGlyph(); });
			overshootSlider.addEventListener("input", (e) => { currentOvershoot = parseInt(e.target.value, 10); renderGlyph(); });
			spacingSlider.addEventListener("input", (e) => { currentSpacing = parseFloat(e.target.value); renderGlyph(); });
			const layoutMediaQuery = window.matchMedia("(max-width: 600px)");
			function handleLayoutChange(e) {
				if (e.matches) {
					inputElement.setAttribute("rows", "3");
				} else {
					inputElement.setAttribute("rows", "7");
				}
			}
			handleLayoutChange(layoutMediaQuery);
			layoutMediaQuery.addEventListener("change", handleLayoutChange);
			themeToggle.addEventListener("click", () => {
				if (document.body.getAttribute("data-theme") === "dark") document.body.removeAttribute("data-theme");
				else document.body.setAttribute("data-theme", "dark");
			});
			styleToggle.addEventListener("click", () => {
				if (currentStyle === "angular") { currentStyle = "rounded"; styleToggle.classList.add("rounded"); }
				else { currentStyle = "angular"; styleToggle.classList.remove("rounded"); }
				renderGlyph();
			});
			// weaveToggle.addEventListener("click", () => {
			// 	weaveMode = !weaveMode;
			// 	if (weaveMode) {
			// 		weaveToggle.classList.add("woven");
			// 	} else {
			// 		weaveToggle.classList.remove("woven");
			// 	}
			// 	renderGlyph();
			// });
			// infoToggle.addEventListener("click", () => {
			//	 const tView = document.getElementById("transcriber-view");
			//	 const iView = document.getElementById("info-view");
				
			//	 // Toggle displays
			//	 const isShowingInfo = iView.style.display !== "none";
			//	 iView.style.display = isShowingInfo ? "none" : "block";
			//	 tView.style.display = isShowingInfo ? "block" : "none";
			// });
			function downloadSVG() {
				const clonedCanvas = svgCanvas.cloneNode(true);
				const viewBox = clonedCanvas.getAttribute("viewBox").split(" ");
				const minX = parseFloat(viewBox[0]);
				const minY = parseFloat(viewBox[1]);
				const width = parseFloat(viewBox[2]);
				const height = parseFloat(viewBox[3]);
				const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
				bgRect.setAttribute("x", minX);
				bgRect.setAttribute("y", minY);
				bgRect.setAttribute("width", width);
				bgRect.setAttribute("height", height);
				bgRect.setAttribute("fill", "#fff");
				clonedCanvas.insertBefore(bgRect, clonedCanvas.firstChild);
				let s = (new XMLSerializer).serializeToString(clonedCanvas);
				
				const e = new Blob([s], {
								type: "image/svg+xml;charset=utf-8"
						}),
						a = URL.createObjectURL(e),
						t = document.createElement("a");
				t.href = a, t.download = "Nyxic.svg", document.body.appendChild(t), t.click(), document.body.removeChild(t), URL.revokeObjectURL(a)
			}
			exportButton.addEventListener("click", downloadSVG);
			styleToggle.classList.add("rounded");
			svgCanvas.setAttribute("shape-rendering", "geometricPrecision");
			renderGlyph();
		</script>
